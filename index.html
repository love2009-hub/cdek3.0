<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VENSKO — Оформление заказа</title>
<!-- Виджет СДЭК версии 4.0 -->
<script src="https://cdn.jsdelivr.net/npm/@cdek-it/widget@4" charset="utf-8"></script>
<style>
  :root{--ink:#000;--line:#111;--muted:#8a8a8a;--bg:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:15px}
  .wrap{max-width:800px;margin:0 auto;padding:24px 20px 80px}
  header{display:flex;justify-content:space-between;padding:18px 0 22px;border-bottom:1px solid var(--line)}
  .logo{font-weight:700;font-style:italic;font-size:26px}
  h2{font-size:18px;margin:38px 0 6px;text-transform:uppercase;letter-spacing:.1em}
  .rule{height:1px;background:var(--line);margin:0 0 22px}
  label{display:block;font-size:14px;text-transform:uppercase;margin:18px 0 8px;letter-spacing:.1em}
  input,textarea{width:100%;padding:14px;border:1px solid var(--line);background:#fff;font:inherit}
  input:focus,textarea:focus{outline:2px solid #000;outline-offset:-2px}
  
  .find-btn{display:block;width:100%;margin-top:8px;padding:10px;background:#f4f4f4;border:1px solid var(--line);font:inherit;text-transform:uppercase;cursor:pointer}
  .find-btn:hover{background:#000;color:#fff}
  
  /* Высота обязательна по инструкции! */
  #cdek-map{width:100%;height:600px;border:1px solid var(--line);margin-top:14px}
  
  .pvz-info{margin-top:10px;padding:12px;background:#f9f9f9;border-left:3px solid #000;display:none}
  .btn{display:block;width:100%;padding:16px;background:#000;color:#fff;border:1px solid var(--line);font:inherit;text-transform:uppercase;cursor:pointer;margin-top:24px;font-weight:bold}
  .btn:hover{background:#fff;color:#000}
  .err{color:#b00020;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">VENSKO</div></header>

  <h2>Корзина</h2><div class="rule"></div>
  <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)">
    <span>VENSKO HUSTLE POLO + OVERSIZED HOODIE</span><span>8 600 ₽</span>
  </div>

  <h2>Контактные данные</h2><div class="rule"></div>
  <label>ФИО *</label><input id="fio" placeholder="Иванов Иван Иванович">
  <label>Телефон *</label><input id="tel" placeholder="+7 999 123 45 67">

  <h2>Доставка СДЭК</h2><div class="rule"></div>
  <label>Город получателя *</label>
  <input id="city" placeholder="Например: Чебоксары" value="Чебоксары">
  <button type="button" id="findCityBtn" class="find-btn">🔍 Найти на карте</button>

  <!-- Контейнер виджета -->
  <div id="cdek-map"></div>
  <div class="err" id="cdekErr"></div>

  <div class="pvz-info" id="pvzInfo">
    <b id="pvzName"></b><br><span id="pvzAddress"></span><br>
    <span style="font-weight:bold;margin-top:6px;display:block" id="pvzTariff"></span>
  </div>

  <label>Адрес доставки *</label>
  <textarea id="addr" rows="2" placeholder="Заполнится автоматически при выборе на карте"></textarea>

  <div style="text-align:right;margin-top:24px;font-size:22px"><b>ИТОГО: <span id="total-sum">8 600</span> ₽</b></div>
  <button class="btn" onclick="pay()">Оформить заказ</button>
</div>

<script>
// КОНФИГУРАЦИЯ
const CDEK_CONFIG = {
  // ВСТАВЬТЕ СЮДА URL ВАШЕГО CLOUDFLARE WORKER ИЗ ШАГА 1
  servicePath: 'https://cdek.aroslavrazzivin.workers.dev/', 
  apiKey: '972c2b0a-3090-439e-982f-4692ad4ab994'
};

let chosenTariff = null, chosenAddress = null;
let currentCity = 'Чебоксары';
let currentCoords = [56.12684, 47.388736]; // Чебоксары по умолчанию
const GOODS_SUM = 8600;

// Инициализация виджета строго по инструкции v4.0
function initWidget(city, coords) {
  document.getElementById('cdek-map').innerHTML = ''; // Очистка перед перерисовкой
  
  try {
    new window.CDEKWidget({
      from: {
        country_code: 'RU',
        city: 'Новосибирск',
        postal_code: 630009,
        code: 270,
        address: 'ул. Большевистская, д. 101',
      },
      root: 'cdek-map',
      apiKey: CDEK_CONFIG.apiKey,
      canChoose: true,
      servicePath: CDEK_CONFIG.servicePath,
      hideFilters: {
        have_cashless: false,
        have_cash: false,
        is_dressing_room: false,
        type: false,
      },
      hideDeliveryOptions: {
        office: false,
        door: false,
      },
      debug: false,
      // Обязательно для расчета!
      goods: [{ width: 15, height: 10, length: 20, weight: 1000 }],
      defaultLocation: coords,
      lang: 'rus',
      currency: 'RUB',
      tariffs: {
        office: [136, 138, 368], // Посылка склад-склад, дверь-склад, склад-постамат
        door: [137, 139],        // Посылка склад-дверь, дверь-дверь
      },
      onReady() {
        document.getElementById('cdekErr').textContent = '';
      },
      onCalculate() {
        // Расчет произведен, ждем выбора пользователя
      },
      onChoose(mode, tariff, address) {
        chosenTariff = tariff;
        chosenAddress = address;
        
        let addrText = '';
        let nameText = 'Доставка';

        if (mode === 'office' && address) {
          nameText = address.name || 'ПВЗ СДЭК';
          addrText = address.address || '';
          if (address.city) document.getElementById('city').value = address.city;
        } else if (mode === 'door' && address) {
          nameText = 'Курьерская доставка';
          addrText = address.formatted || address.address || '';
        }

        if (addrText) {
          document.getElementById('addr').value = addrText;
        }

        document.getElementById('pvzName').textContent = nameText;
        document.getElementById('pvzAddress').textContent = addrText;
        document.getElementById('pvzTariff').textContent = tariff ? 
          `Тариф: ${tariff.tariff_name} · ${tariff.delivery_sum} ₽` : 'Тариф не рассчитан';
        document.getElementById('pvzInfo').style.display = 'block';
        
        updateTotal();
      }
    });
  } catch (err) {
    document.getElementById('cdekErr').textContent = 'Ошибка виджета: ' + err.message;
  }
}

// Поиск города через Яндекс Геокодер
async function geocodeAndMove(cityName) {
  document.getElementById('cdekErr').textContent = 'Поиск...';
  try {
    const url = `https://geocode-maps.yandex.ru/1.x/?apikey=${CDEK_CONFIG.apiKey}&geocode=${encodeURIComponent(cityName)}&format=json&results=1`;
    const data = await (await fetch(url)).json();
    const pos = data?.response?.GeoObjectCollection?.featureMember?.[0]?.GeoObject?.Point?.pos;
    
    if (pos) {
      const [lng, lat] = pos.split(' ').map(Number);
      currentCity = cityName;
      currentCoords = [lat, lng];
      document.getElementById('city').value = cityName;
      document.getElementById('cdekErr').textContent = '';
      initWidget(currentCity, currentCoords);
    } else {
      document.getElementById('cdekErr').textContent = 'Город не найден. Проверьте название.';
    }
  } catch (err) {
    document.getElementById('cdekErr').textContent = 'Ошибка геокодера. Проверьте ключ Яндекса (403).';
  }
}

// Обработчики кнопки и Enter
document.getElementById('findCityBtn').addEventListener('click', () => {
  const val = document.getElementById('city').value.trim();
  if (val.length > 2) geocodeAndMove(val);
});
document.getElementById('city').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('findCityBtn').click();
  }
});

function updateTotal() {
  const sum = chosenTariff ? (GOODS_SUM + chosenTariff.delivery_sum) : GOODS_SUM;
  document.getElementById('total-sum').textContent = sum.toLocaleString('ru-RU');
}

function pay() {
  if (!document.getElementById('fio').value.trim() || !document.getElementById('tel').value.trim()) {
    return alert('Заполните ФИО и телефон');
  }
  if (!chosenTariff) return alert('Выберите способ доставки на карте');
  if (!document.getElementById('addr').value.trim()) return alert('Адрес не заполнен');

  const order = {
    city: currentCity,
    address: document.getElementById('addr').value,
    tariff: chosenTariff.tariff_name,
    total: document.getElementById('total-sum').textContent + ' ₽'
  };
  console.log('ЗАКАЗ:', order);
  alert('Заказ оформлен!\nДоставка: ' + chosenTariff.delivery_sum + ' ₽\nИтого: ' + order.total);
}

// Запуск при загрузке
document.addEventListener('DOMContentLoaded', () => {
  initWidget(currentCity, currentCoords);
});
</script>
</body>
</html>
