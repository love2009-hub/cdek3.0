<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VENSKO — Оформление заказа</title>
<script src="https://cdn.jsdelivr.net/npm/@cdek-it/widget@3" charset="utf-8"></script>
<style>
  :root{--ink:#000;--line:#111;--muted:#8a8a8a;--bg:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:15px;letter-spacing:.02em}
  .wrap{max-width:800px;margin:0 auto;padding:24px 20px 80px}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 22px;border-bottom:1px solid var(--line)}
  .logo{font-weight:700;font-style:italic;font-size:26px;letter-spacing:.06em}
  h2{font-size:18px;letter-spacing:.12em;margin:38px 0 6px;text-transform:uppercase}
  .rule{height:1px;background:var(--line);margin:0 0 22px}
  label{display:block;font-size:14px;letter-spacing:.1em;text-transform:uppercase;margin:18px 0 8px}
  label .req{color:#000}
  input,select,textarea{width:100%;padding:14px;border:1px solid var(--line);background:#fff;font:inherit;color:var(--ink)}
  input:focus,textarea:focus{outline:2px solid #000;outline-offset:-2px}
  
  /* Контейнер карты ОБЯЗАТЕЛЬНО должен иметь высоту */
  #cdek-map { width: 100%; height: 600px; border: 1px solid var(--line); margin-top: 14px; }
  
  .pvz-info { margin-top: 10px; font-size: 13px; color: #333; border-left: 2px solid #000; padding-left: 10px; }
  .btn { display:block; width:100%; padding:16px; border:1px solid var(--line); background:#000; color:#fff; font:inherit; cursor:pointer; text-transform:uppercase; letter-spacing:.1em; margin-top: 24px; }
  .btn:hover { background:#fff; color:#000; }
  .err { color:#b00020; font-size:13px; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">VENSKO</div>
  </header>

  <h2>Контактные данные</h2><div class="rule"></div>
  <label>ФИО <span class="req">*</span></label>
  <input id="fio" placeholder="Иванов Иван Иванович">
  <label>Телефон <span class="req">*</span></label>
  <input id="tel" placeholder="+7 999 123 45 67">

  <h2>Доставка СДЭК</h2><div class="rule"></div>
  <label>Город <span class="req">*</span></label>
  <input id="city" placeholder="Чебоксары" value="Чебоксары">
  
  <!-- Контейнер для виджета -->
  <div id="cdek-map"></div>
  <div class="pvz-info" id="pvzInfo">Выберите пункт выдачи на карте или из списка справа.</div>
  <div class="err" id="cdekErr"></div>

  <label>Адрес доставки <span class="req">*</span> (заполняется автоматически)</label>
  <textarea id="addr" rows="2" placeholder="Город, улица, дом, квартира, индекс"></textarea>

  <button class="btn" onclick="pay()">Оформить заказ</button>
</div>

<script>
const CDEK_CONFIG = {
  servicePath: 'https://cdek.aroslavrazzivin.workers.dev/',
  apiKey: '972c2b0a-3090-439e-982f-4692ad4ab994',
};

let chosenAddress = null;
let chosenTariff = null;

// Инициализация виджета строго по вашей конфигурации из документации
document.addEventListener('DOMContentLoaded', () => {
  try {
    new window.CDEKWidget({
      from: 'Чебоксары',
      root: 'cdek-map',
      apiKey: CDEK_CONFIG.apiKey,
      servicePath: CDEK_CONFIG.servicePath,
      defaultLocation: 'Чебоксары',
      canChoose: true,
      sender: false,
      fixBounds: 'country',
      popup: false,
      debug: false,
      requirePostcode: false,
      lang: 'rus',
      currency: 'RUB',
      hideDeliveryOptions: {
        office: false,
        door: false
      },
      forceFilters: {
        have_cashless: true,
        have_cash: null,
        is_dressing_room: null,
        allowed_cod: null,
        type: null
      },
      hideFilters: {
        have_cashless: false,
        have_cash: true,
        is_dressing_room: false,
        type: false
      },
      // Событие выбора ПВЗ или курьерской доставки
      onChoose: (mode, tariff, address) => {
        chosenTariff = tariff;
        chosenAddress = address;
        
        let addrText = '';
        let name = 'Доставка';

        if (address) {
          if (address.PVZ) {
            // Выбран пункт выдачи
            name = address.PVZ.Name || 'ПВЗ СДЭК';
            addrText = address.PVZ.Address || '';
          } else if (address.address) {
            // Выбрана курьерская доставка
            name = 'Курьерская доставка';
            addrText = address.address;
          }
        }

        // АВТОЗАПОЛНЕНИЕ поля адреса
        if (addrText) {
          document.getElementById('addr').value = addrText;
        }

        document.getElementById('pvzInfo').innerHTML = 
          `<b>${name}</b><br>${addrText}<br><span style="color:#8a8a8a">Тариф: ${tariff?.tariff_name || 'Не выбран'} · ${tariff?.delivery_sum || 0} ₽</span>`;
        
        document.getElementById('cdekErr').textContent = '';
      },
      onError: (e) => {
        document.getElementById('cdekErr').textContent = 'Ошибка виджета: ' + (e.message || JSON.stringify(e));
      }
    });
  } catch (err) {
    document.getElementById('cdekErr').textContent = 'Не удалось загрузить виджет: ' + err.message;
  }
});

function pay() {
  const fio = document.getElementById('fio').value.trim();
  const tel = document.getElementById('tel').value.trim();
  const addr = document.getElementById('addr').value.trim();

  if (!fio || !tel) { alert('Заполните ФИО и телефон'); return; }
  if (!chosenTariff) { alert('Пожалуйста, выберите способ доставки на карте СДЭК'); return; }
  if (!addr) { alert('Адрес доставки не указан'); return; }

  const orderData = {
    customer: { fio, tel },
    delivery: {
      tariff: chosenTariff,
      addressDetails: chosenAddress,
      finalAddress: addr
    }
  };
  
  console.log('ГОТОВЫЙ ЗАКАЗ:', orderData);
  alert('Заказ успешно сформирован! Данные выведены в консоль (F12).');
}
</script>
</body>
</html>
