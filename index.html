<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-магазин с доставкой СДЭК</title>
    
    <!-- Виджет СДЭК v4 -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@cdek-it/widget@4" charset="utf-8"></script>
    
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; color: #333; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        .input-row input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .input-row button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .input-row button:hover { background: #0056b3; }
        .input-row button:disabled { background: #ccc; cursor: not-allowed; }
        
        .product { border: 1px solid #e0e0e0; padding: 20px; margin-bottom: 15px; border-radius: 8px; background: #fdfdfd; }
        .product h3 { margin-top: 0; color: #2c3e50; }
        .product button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .product button:hover { background-color: #0056b3; }
        .product button.active { background-color: #28a745; }
        
        #cdek-map { width: 100%; max-width: 800px; height: 600px; margin-top: 20px; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
        
        #search-status { margin-top: 10px; padding: 10px; border-radius: 5px; display: none; font-size: 14px; }
        #search-status.success { background: #d4edda; color: #155724; display: block; }
        #search-status.error { background: #f8d7da; color: #721c24; display: block; }
        #search-status.loading { background: #fff3cd; color: #856404; display: block; }
        
        #debug-log { margin-top: 20px; padding: 10px; background: #f5f5f5; border: 1px solid #ddd; border-radius: 5px; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        #debug-log div { margin-bottom: 4px; border-bottom: 1px solid #eee; padding-bottom: 2px; }
    </style>
</head>
<body>

    <h1>Мини-интернет магазин</h1>
    <p>Выберите товар и укажите город доставки.</p>
    
    <div class="input-group">
        <label for="city-input">🏙️ Город доставки:</label>
        <div class="input-row">
            <input type="text" id="city-input" placeholder="Введите город (например, Москва, Казань)" value="Чебоксары">
            <button onclick="searchCity()" id="search-btn">Найти</button>
        </div>
        <div id="search-status"></div>
    </div>

    <div class="input-group">
        <label for="address-input">📍 Адрес ПВЗ:</label>
        <div class="input-row">
            <input type="text" id="address-input" placeholder="Выберите ПВЗ на карте или введите вручную">
        </div>
        <small style="color: #666;">Адрес заполняется автоматически при клике на ПВЗ на карте.</small>
    </div>

    <div class="product">
        <h3>📦 Товар №1: Смартфон</h3>
        <p>Компактная электроника.</p>
        <button onclick="selectProduct(0, this)">Рассчитать доставку</button>
    </div>

    <div class="product">
        <h3>📦 Товар №2: Микроволновая печь</h3>
        <p>Крупная бытовая техника.</p>
        <button onclick="selectProduct(1, this)">Рассчитать доставку</button>
    </div>

    <div class="product">
        <h3>📦 Товар №3: Чехол для телефона</h3>
        <p>Мелкий аксессуар.</p>
        <button onclick="selectProduct(2, this)">Рассчитать доставку</button>
    </div>

    <div id="cdek-map"></div>

    <div id="debug-log">
        <strong>Лог виджета:</strong><br>
    </div>

    <script type="text/javascript">
        const PRODUCTS_DATA = [
            { name: "Смартфон", weight: 400, length: 18, width: 10, height: 3 },
            { name: "Микроволновая печь", weight: 12500, length: 50, width: 40, height: 30 },
            { name: "Чехол для телефона", weight: 50, length: 16, width: 9, height: 2 }
        ];

        let currentWidget = null;
        let currentCity = 'Чебоксары';
        let currentCoords = [47.2519, 56.1439]; // [longitude, latitude]
        let currentProductIndex = 0;

        function log(message, type = 'info') {
            const debugLog = document.getElementById('debug-log');
            const entry = document.createElement('div');
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            entry.style.color = type === 'error' ? '#d32f2f' : type === 'success' ? '#2e7d32' : '#333';
            debugLog.appendChild(entry);
            debugLog.scrollTop = debugLog.scrollHeight;
            console.log(`[Widget Log] ${message}`);
        }

        async function searchCity() {
            const cityInput = document.getElementById('city-input').value.trim();
            const searchBtn = document.getElementById('search-btn');

            if (!cityInput) {
                showStatus('Введите название города', 'error');
                return;
            }

            showStatus('Поиск города...', 'loading');
            searchBtn.disabled = true;
            log(`Поиск координат для: ${cityInput}`);

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cityInput)}&limit=1&countrycodes=ru`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    
                    currentCity = cityInput;
                    currentCoords = [lon, lat];
                    
                    log(`✅ Город найден: ${data[0].display_name}`, 'success');
                    showStatus(`✓ Город найден: ${cityInput}`, 'success');
                    
                    initWidget(currentProductIndex);
                } else {
                    log(`❌ Город не найден: ${cityInput}`, 'error');
                    showStatus('✗ Город не найден. Попробуйте другое название.', 'error');
                }
            } catch (error) {
                log(`❌ Ошибка поиска: ${error.message}`, 'error');
                showStatus('✗ Ошибка сети при поиске города.', 'error');
            } finally {
                searchBtn.disabled = false;
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('search-status');
            statusDiv.textContent = message;
            statusDiv.className = type;
        }

        function initWidget(productIndex) {
            const product = PRODUCTS_DATA[productIndex];
            document.getElementById('cdek-map').innerHTML = '';
            
            log(`Инициализация виджета: ${product.name} (${product.weight}г)`);

            currentWidget = new window.CDEKWidget({
                from: 'Чебоксары',
                root: 'cdek-map',
                
                // 🌟 ГЛАВНОЕ ИСПРАВЛЕНИЕ: Используем бесплатные карты OSM вместо Яндекс
                mapType: 'osm', 
                // apiKey удален, так как для OSM он не нужен и вызывал ошибку 403
                
                servicePath: 'https://cdek.aroslavrazzivin.workers.dev', 
                defaultLocation: currentCoords,
                defaultLocationZoom: 12,
                goods: [{
                    length: product.length,
                    width: product.width,
                    height: product.height,
                    weight: product.weight
                }],
                onReady: () => {
                    log('✅ Виджет успешно загружен', 'success');
                },
                onCalculate: (data) => {
                    log(`💰 Расчет тарифов получен`, 'success');
                },
                onChange: (pvz) => {
                    if (pvz && pvz.address) {
                        const fullAddress = `${pvz.city || currentCity}, ${pvz.address}`;
                        document.getElementById('address-input').value = fullAddress;
                        log(`📍 Выбран ПВЗ: ${pvz.code} (${fullAddress})`, 'success');
                    }
                }
            });
        }

        function selectProduct(index, btnElement) {
            currentProductIndex = index;
            log(`Выбран товар: ${PRODUCTS_DATA[index].name}`);
            
            document.querySelectorAll('.product button').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            
            initWidget(index);
        }

        document.getElementById('city-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchCity();
        });

        document.addEventListener('DOMContentLoaded', () => {
            log('Страница загружена');
            initWidget(0);
        });
    </script>
</body>
</html>
