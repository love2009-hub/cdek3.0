<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-магазин с доставкой СДЭК</title>
    <!-- Подключение виджета СДЭК v4 -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@cdek-it/widget@4" charset="utf-8"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background-color: #f9f9f9; }
        .store-section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .products { display: flex; gap: 15px; flex-wrap: wrap; }
        .product-card { border: 1px solid #ddd; padding: 15px; border-radius: 6px; cursor: pointer; transition: all 0.2s; width: 200px; text-align: center; }
        .product-card:hover { border-color: #1a8c24; background-color: #f0fdf2; }
        .product-card.active { border-color: #1a8c24; background-color: #e6f7e9; font-weight: bold; }
        .controls { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; align-items: flex-end; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 14px; margin-bottom: 5px; color: #555; font-weight: 600; }
        .input-group input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: 250px; }
        button.apply-btn { padding: 9px 15px; background-color: #1a8c24; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button.apply-btn:hover { background-color: #146c1c; }
        #cdek-map { width: 100%; height: 600px; border-radius: 8px; overflow: hidden; border: 1px solid #ddd; }
        .info-text { font-size: 13px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="store-section">
        <h2>Выберите товар</h2>
        <div class="products">
            <!-- Габариты скрыты в data-атрибутах и не видны пользователю напрямую как текст -->
            <div class="product-card" onclick="selectProduct(0)" id="prod-0">
                <div>📦 Кроссовки</div>
                <div style="color: #1a8c24; margin-top: 5px;">5 000 ₽</div>
            </div>
            <div class="product-card" onclick="selectProduct(1)" id="prod-1">
                <div>🎧 Наушники</div>
                <div style="color: #1a8c24; margin-top: 5px;">3 000 ₽</div>
            </div>
            <div class="product-card" onclick="selectProduct(2)" id="prod-2">
                <div>🎒 Рюкзак</div>
                <div style="color: #1a8c24; margin-top: 5px;">4 500 ₽</div>
            </div>
        </div>
    </div>

    <div class="store-section">
        <h2>Оформление доставки</h2>
        <div class="controls">
            <div class="input-group">
                <label for="city-input">Город получателя</label>
                <input type="text" id="city-input" value="Чебоксары" placeholder="Введите город">
            </div>
            <button class="apply-btn" onclick="updateCity()">Применить город</button>
            
            <div class="input-group" style="flex-grow: 1;">
                <label for="address-input">Адрес доставки (ПВЗ или ручной ввод)</label>
                <input type="text" id="address-input" placeholder="Выберите ПВЗ на карте или введите адрес вручную">
            </div>
        </div>
        <div class="info-text">💡 При выборе пункта выдачи на карте, поле "Адрес" заполнится автоматически. Вы также можете изменить его вручную.</div>
        
        <div id="cdek-map"></div>
    </div>

    <script type="text/javascript">
        // 1. Конфигурация товаров (габариты в коде, но не отображаются в HTML напрямую)
        // weight в граммах, габариты в см
        const products = [
            { name: "Кроссовки", weight: 800, length: 30, width: 20, height: 12 },
            { name: "Наушники", weight: 300, length: 20, width: 18, height: 8 },
            { name: "Рюкзак", weight: 600, length: 45, width: 30, height: 15 }
        ];

        let currentProductIndex = 0;
        let cdekWidget = null;

        // ЗАМЕНИТЕ ЭТУ ССЫЛКУ на URL вашего Cloudflare Worker или service.php
        const SERVICE_PHP_URL = 'https://cdek.aroslavrazzivin.workers.dev/'; 
        const YANDEX_API_KEY = '89e052c4-e455-4c32-bca9-f83a2464c827';

        // 2. Инициализация виджета
        function initWidget(city = 'Чебоксары') {
            const container = document.getElementById('cdek-map');
            container.innerHTML = ''; // Очистка для повторной инициализации

            const selectedProd = products[currentProductIndex];

            cdekWidget = new window.CDEKWidget({
                from: {
                    country_code: 'RU',
                    city: 'Чебоксары', // Отправка из Чебоксар (можно изменить на ваш город отправки)
                },
                to: {
                    country_code: 'RU',
                    city: city
                },
                root: 'cdek-map',
                apiKey: YANDEX_API_KEY,
                servicePath: SERVICE_PHP_URL,
                canChoose: true,
                defaultLocation: 'Чебоксары',
                lang: 'rus',
                currency: 'RUB',
                goods: [{
                    width: selectedProd.width,
                    height: selectedProd.height,
                    length: selectedProd.length,
                    weight: selectedProd.weight
                }],
                onReady: () => {
                    console.log('Виджет СДЭК загружен');
                },
                onChoose: (mode, tariff, address) => {
                    // АВТОМАТИЧЕСКОЕ ЗАПОЛНЕНИЕ АДРЕСА ПРИ ВЫБОРЕ ПВЗ
                    if (mode === 'office' && address && address.address) {
                        document.getElementById('address-input').value = address.address;
                    } else if (mode === 'door' && address && address.formatted) {
                        document.getElementById('address-input').value = address.formatted;
                    }
                }
            });
        }

        // 3. Логика выбора товара
        function selectProduct(index) {
            currentProductIndex = index;
            
            // Визуальное выделение
            document.querySelectorAll('.product-card').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            // Обновление габаритов в виджете без полной перезагрузки (метод addParcel/resetParcels)
            if (cdekWidget) {
                cdekWidget.resetParcels();
                const prod = products[index];
                cdekWidget.addParcel({
                    width: prod.width,
                    height: prod.height,
                    length: prod.length,
                    weight: prod.weight
                });
            }
        }

        // 4. Логика смены города
        function updateCity() {
            const city = document.getElementById('city-input').value.trim();
            if (city.length > 2) {
                // Пересоздаем виджет с новым городом получения
                initWidget(city);
            } else {
                alert('Пожалуйста, введите корректное название города');
            }
        }

        // Запуск при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            selectProduct(0); // Выбираем первый товар по умолчанию
            initWidget('Чебоксары');
        });
    </script>
</body>
</html>
