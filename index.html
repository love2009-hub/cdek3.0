<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VENSKO — Оформление заказа СДЭК</title>
<!-- Виджет СДЭК версии 4 -->
<script src="https://cdn.jsdelivr.net/npm/@cdek-it/widget@4" charset="utf-8"></script>
<style>
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
  /* Высота обязательна по инструкции, иначе виджет не будет виден! */
  #cdek-map { width: 100%; height: 600px; border: 1px solid #ccc; margin-top: 20px; }
  .result-box { margin-top: 20px; padding: 15px; background: #f4f4f4; border-left: 4px solid #000; display: none; }
  h2 { border-bottom: 1px solid #eee; padding-bottom: 10px; }
</style>
</head>
<body>

<h2>Оформление доставки СДЭК</h2>

<!-- Элемент, в который будет встроен виджет -->
<div id="cdek-map"></div>

<!-- Блок для вывода результата выбора -->
<div class="result-box" id="resultBox">
  <h3>Выбранная доставка:</h3>
  <p><b>Режим:</b> <span id="resMode"></span></p>
  <p><b>Тариф:</b> <span id="resTariff"></span></p>
  <p><b>Стоимость:</b> <span id="resPrice"></span> ₽</p>
  <p><b>Срок:</b> <span id="resPeriod"></span> дн.</p>
  <p><b>Адрес/ПВЗ:</b> <span id="resAddress"></span></p>
</div>

<script type="text/javascript">
  document.addEventListener('DOMContentLoaded', () => {
    new window.CDEKWidget({
      // Город отправителя: Чебоксары (код 419)
      from: {
        country_code: 'RU',
        city: 'Чебоксары',
        code: 419,
      },
      root: 'cdek-map',
      apiKey: '89e052c4-e455-4c32-bca9-f83a2464c827',
      canChoose: true,
      
      // ⚠️ ЗАМЕНИТЕ ЭТУ СТРОКУ НА ВАШ РЕАЛЬНЫЙ URL CLOUDFLARE WORKER
      servicePath: 'https://ВАШ_URL_CLOUDFLARE_WORKER.workers.dev',
      
      hideFilters: {
        have_cashless: false,
        have_cash: false,
        is_dressing_room: false,
        type: false,
      },
      hideDeliveryOptions: {
        office: false,
        door: false,
      },
      debug: false,
      
      // Габариты посылки (вес указан 1000г = 1кг, чтобы тарифы считались корректно)
      goods: [
        {
          width: 10,
          height: 10,
          length: 10,
          weight: 1000,
        },
      ],
      
      // Координаты Чебоксар по умолчанию
      defaultLocation: [56.12684, 47.388736],
      lang: 'rus',
      currency: 'RUB',
      
      // Тарифы строго по вашему запросу
      tariffs: {
        office: [233, 137, 139],
        door: [234, 136, 138],
        pickup: [],
      },
      
      onReady() {
        console.log('Виджет загружен');
      },
      onCalculate() {
        console.log('Расчет стоимости доставки произведен');
      },
      onChoose(mode, tariff, address) {
        console.log('Доставка выбрана:', mode, tariff, address);
        
        // Отображаем выбранные данные на странице
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('resMode').textContent = mode === 'office' ? 'До ПВЗ' : 'До двери';
        document.getElementById('resTariff').textContent = tariff.tariff_name;
        document.getElementById('resPrice').textContent = tariff.delivery_sum;
        document.getElementById('resPeriod').textContent = `${tariff.period_min} - ${tariff.period_max}`;
        
        let addrText = '';
        if (mode === 'office' && address) {
          addrText = `${address.name}, ${address.address}`;
        } else if (mode === 'door' && address) {
          addrText = address.formatted || address.address || 'Адрес не указан';
        }
        document.getElementById('resAddress').textContent = addrText;
      },
    });
  });
</script>

</body>
</html>
