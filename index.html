<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VENSKO — Оформление заказа</title>
<script src="https://cdn.jsdelivr.net/npm/@cdek-it/widget@3" charset="utf-8"></script>
<style>
  :root{--ink:#000;--line:#111;--muted:#8a8a8a;--bg:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:15px;letter-spacing:.02em}
  .wrap{max-width:800px;margin:0 auto;padding:24px 20px 80px}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 22px;border-bottom:1px solid var(--line)}
  .logo{font-weight:700;font-style:italic;font-size:26px;letter-spacing:.06em}
  h2{font-size:18px;letter-spacing:.12em;margin:38px 0 6px;text-transform:uppercase}
  .rule{height:1px;background:var(--line);margin:0 0 22px}
  label{display:block;font-size:14px;letter-spacing:.1em;text-transform:uppercase;margin:18px 0 8px}
  label .req{color:#000}
  label .hint{color:var(--muted);text-transform:none;letter-spacing:.02em;font-size:12px;margin-left:8px}
  input,select,textarea{width:100%;padding:14px;border:1px solid var(--line);background:#fff;font:inherit;color:var(--ink)}
  input:focus,textarea:focus{outline:2px solid #000;outline-offset:-2px}
  
  /* Контейнер карты ОБЯЗАТЕЛЬНО должен иметь высоту, как в инструкции */
  #cdek-map { width: 100%; height: 600px; border: 1px solid var(--line); margin-top: 14px; }
  
  .pvz-info { margin-top: 10px; font-size: 13px; color: #333; border-left: 3px solid #000; padding: 12px; background: #f9f9f9; display: none; }
  .btn { display:block; width:100%; padding:16px; border:1px solid var(--line); background:#000; color:#fff; font:inherit; cursor:pointer; text-transform:uppercase; letter-spacing:.1em; margin-top: 24px; font-weight: bold; }
  .btn:hover { background:#fff; color:#000; }
  .err { color:#b00020; font-size:13px; margin-top:8px; font-weight: bold; }
  .cart-item { display:flex; justify-content:space-between; padding: 8px 0; border-bottom: 1px dashed var(--line); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">VENSKO</div>
  </header>

  <h2>Корзина</h2><div class="rule"></div>
  <div id="cart-list">
    <div class="cart-item"><span>VENSKO HUSTLE POLO (Коричневый, M/L)</span><span>3 400 ₽</span></div>
    <div class="cart-item"><span>VENSKO OVERSIZED HOODIE (Чёрный, L/XL)</span><span>5 200 ₽</span></div>
  </div>
  <div style="text-align:right; margin-top:12px; font-size:18px;"><b>Товары: <span id="goods-sum">8 600</span> ₽</b></div>

  <h2>Контактные данные</h2><div class="rule"></div>
  <label>ФИО <span class="req">*</span></label>
  <input id="fio" placeholder="Иванов Иван Иванович">
  <label>Телефон <span class="req">*</span></label>
  <input id="tel" placeholder="+7 999 123 45 67">

  <h2>Доставка СДЭК</h2><div class="rule"></div>
  
  <!-- Внешнее поле города. Оно заполняется автоматически из виджета -->
  <label>Город получателя <span class="req">*</span> <span class="hint">(выберите город внутри карты ниже, и это поле заполнится само)</span></label>
  <input id="city" placeholder="Например: Чебоксары" value="Чебоксары" readonly style="background:#f4f4f4; cursor:not-allowed;">
  
  <!-- Контейнер для виджета -->
  <div id="cdek-map"></div>
  <div class="err" id="cdekErr"></div>
  
  <div class="pvz-info" id="pvzInfo">
    <b id="pvzName"></b><br>
    <span id="pvzAddress"></span><br>
    <span style="color:#000; font-weight:bold; margin-top:6px; display:block;" id="pvzTariff"></span>
  </div>

  <label>Адрес доставки <span class="req">*</span> <span class="hint">(заполняется автоматически при выборе на карте)</span></label>
  <textarea id="addr" rows="2" placeholder="Город, улица, дом, квартира, индекс"></textarea>

  <div style="text-align:right; margin-top:24px; font-size:22px;">
    <b>ИТОГО: <span id="total-sum">8 600</span> ₽</b>
  </div>

  <button class="btn" onclick="pay()">Оформить заказ</button>
</div>

<script>
const CDEK_CONFIG = {
  servicePath: 'https://cdek.aroslavrazzivin.workers.dev/',
  apiKey: '972c2b0a-3090-439e-982f-4692ad4ab994',
};

let chosenTariff = null;
let chosenPvz = null;
const GOODS_SUM = 8600;

document.addEventListener('DOMContentLoaded', () => {
  try {
    // Инициализация строго по вашей конфигурации из документации
    const widget = new window.CDEKWidget({
      from: 'Чебоксары',
      root: 'cdek-map',
      apiKey: CDEK_CONFIG.apiKey,
      servicePath: CDEK_CONFIG.servicePath,
      defaultLocation: 'Чебоксары',
      canChoose: true,
      sender: false,
      fixBounds: 'country',
      popup: false,
      debug: false,
      requirePostcode: false,
      lang: 'rus',
      currency: 'RUB',
      hideDeliveryOptions: { office: false, door: false },
      forceFilters: { have_cashless: true, have_cash: null, is_dressing_room: null, allowed_cod: null, type: null },
      hideFilters: { have_cashless: false, have_cash: true, is_dressing_room: false, type: false },
      
      // ГЛАВНОЕ: обработка выбора ПВЗ или курьерской доставки
      onChoose: function(profile, tariff, pvz) {
        console.log('СДЭК Выбор:', profile, tariff, pvz);
        
        chosenTariff = tariff;
        chosenPvz = pvz;
        
        let addrText = '';
        let nameText = 'Доставка';
        let cityText = '';

        if (profile === 'office' && pvz) {
          nameText = pvz.name || 'Пункт выдачи СДЭК';
          addrText = pvz.address || (pvz.location && pvz.location.address_full) || '';
          cityText = pvz.city || '';
        } else if (profile === 'door' && pvz) {
          nameText = 'Курьерская доставка';
          addrText = pvz.address || '';
          cityText = pvz.city || '';
        }

        // 1. Автозаполнение внешнего поля города
        if (cityText) {
          document.getElementById('city').value = cityText;
        }

        // 2. Автозаполнение поля адреса
        if (addrText) {
          document.getElementById('addr').value = addrText;
        }
        
        // 3. Отображение информации о выборе
        document.getElementById('pvzName').textContent = nameText;
        document.getElementById('pvzAddress').textContent = addrText;
        document.getElementById('pvzTariff').textContent = tariff ? `Тариф: ${tariff.tariff_name} · ${tariff.delivery_sum} ₽` : 'Тариф не рассчитан';
        document.getElementById('pvzInfo').style.display = 'block';
        document.getElementById('cdekErr').textContent = '';

        // 4. Пересчет итоговой суммы
        updateTotal();
      },

      onError: function(e) {
        console.error('СДЭК Ошибка:', e);
        document.getElementById('cdekErr').textContent = 'Ошибка загрузки СДЭК: ' + (e.message || JSON.stringify(e));
      }
    });
  } catch (err) {
    document.getElementById('cdekErr').textContent = 'Не удалось загрузить виджет: ' + err.message;
  }
});

function updateTotal() {
  const deliverySum = chosenTariff ? chosenTariff.delivery_sum : 0;
  document.getElementById('total-sum').textContent = (GOODS_SUM + deliverySum).toLocaleString('ru-RU');
}

function pay() {
  const fio = document.getElementById('fio').value.trim();
  const tel = document.getElementById('tel').value.trim();
  const addr = document.getElementById('addr').value.trim();
  const city = document.getElementById('city').value.trim();

  if (!fio || !tel) { alert('Заполните ФИО и телефон'); return; }
  if (!city) { alert('Укажите город доставки (выберите его на карте СДЭК)'); return; }
  if (!chosenTariff) { alert('Пожалуйста, выберите пункт выдачи или способ доставки на карте СДЭК'); return; }
  if (!addr) { alert('Адрес доставки не заполнен. Выберите ПВЗ на карте.'); return; }

  const orderData = {
    customer: { fio, tel },
    delivery: {
      city: city,
      address: addr,
      tariffCode: chosenTariff.tariff_code,
      tariffName: chosenTariff.tariff_name,
      deliverySum: chosenTariff.delivery_sum,
      pvzCode: chosenPvz ? (chosenPvz.code || chosenPvz.location?.code) : null
    },
    total: GOODS_SUM + chosenTariff.delivery_sum
  };
  
  console.log('✅ ГОТОВЫЙ ЗАКАЗ К ОТПРАВКЕ:', orderData);
  alert('Заказ успешно сформирован!\n\nГород: ' + city + '\nАдрес: ' + addr + '\nДоставка: ' + chosenTariff.delivery_sum + ' ₽\nИтого: ' + orderData.total + ' ₽\n\n(Данные выведены в консоль F12)');
}
</script>
</body>
</html>
